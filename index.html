<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title">大腸菌コロニーカウンタ</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<header>
  <div class="header-top">
    <h1 data-i18n="app.title">大腸菌コロニーカウンタ</h1>
    <label class="language"><span class="sr-only" data-i18n="language.label">表示言語</span>
      <select id="language" aria-label="表示言語" data-i18n-aria-label="language.label">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>
  <p data-i18n="header.description">軽量な画像処理と SlimSAM の2つの方式を選べます。どちらもブラウザ内で動き、画像は外部に送信されません。</p>
</header>

<main>
  <section>
    <div class="stage-wrap">
      <div class="toolbar" role="toolbar" aria-label="編集モード" data-i18n-aria-label="toolbar.aria">
        <button id="mRoi" aria-pressed="true" disabled data-i18n="mode.roi">シャーレ範囲</button>
        <button id="mAdd" aria-pressed="false" disabled data-i18n="mode.add">コロニーを追加</button>
        <button id="mDel" aria-pressed="false" disabled data-i18n="mode.remove">コロニーを削除</button>
        <button id="clearRoi" disabled data-i18n="mode.clearRoi">範囲を解除</button>
        <span class="spacer"></span>
        <button class="src" id="camBtn" data-i18n="source.camera">撮影</button>
        <button class="src" id="pickBtn" data-i18n="source.pick">写真を選択</button>
        <span class="hint" id="modeHint"></span>
      </div>
      <div id="canvasBox">
        <canvas id="view" width="10" height="10" hidden></canvas>
        <div id="drop" tabindex="0" role="button" aria-label="画像を選択" data-i18n-aria-label="drop.aria">
          <strong data-i18n="drop.title">シャーレの写真を用意してください</strong>
          <span data-i18n="drop.description">真上から、影や反射を避けて撮るとうまくいきます。PCでは画像のドロップも使えます。</span>
          <div class="dbtns">
            <button type="button" class="cam" id="dCam" data-i18n="drop.camera">カメラで撮影</button>
            <button type="button" id="dPick" data-i18n="source.pick">写真を選択</button>
          </div>
        </div>
        <div id="busy" role="status"></div>
      </div>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  </section>

  <aside>
    <div class="card count" aria-live="polite">
      <div class="label" data-i18n="count.label">コロニー数</div>
      <div class="num" id="total">–</div>
      <div class="sub" id="sub"></div>
    </div>

    <div class="card sam-only">
      <h2 data-i18n="model.heading">モデル</h2>
      <div id="modelStatus" data-i18n="model.waiting">読み込み待ち…</div>
      <div class="bar"><i id="modelBar"></i></div>
    </div>

    <div class="card">
      <h2 data-i18n="settings.heading">検出設定</h2>
      <div class="engine" role="radiogroup" aria-label="検出方式" data-i18n-aria-label="engine.aria">
        <label><input type="radio" name="engine" value="light"><span class="pill" data-i18n="engine.light">軽量（SAMなし）</span></label>
        <label><input type="radio" name="engine" value="sam"><span class="pill" data-i18n="engine.sam">SAM（高精度）</span></label>
        <button type="button" class="help" data-help="engine" aria-expanded="false" aria-label="検出方式の説明" data-i18n-aria-label="engine.help">?</button>
      </div>
      <div class="row sam-only">
        <span class="lbl"><label for="samModel" data-i18n="samModel.label">SAMモデル</label>
        <button type="button" class="help" data-help="samModel" aria-expanded="false" aria-label="SAMモデルの説明" data-i18n-aria-label="samModel.help">?</button></span>
        <select id="samModel">
          <option value="slim" data-i18n="samModel.slim">SlimSAM（軽い）</option>
          <option value="sam3" data-i18n="samModel.sam3">SAM 3 Tracker（重い）</option>
        </select>
      </div>
      <div class="row sam-only">
        <span class="lbl"><label for="spacing" data-i18n="spacing.label">探索点の間隔</label><button type="button" class="help" data-help="spacing" aria-expanded="false" aria-label="探索点の間隔の説明" data-i18n-aria-label="spacing.help">?</button></span><output id="spacingO"></output>
        <input type="range" id="spacing" min="8" max="48" step="1" value="20">
      </div>
      <div class="row">
        <span class="lbl"><label for="minD" data-i18n="minD.label">最小直径</label><button type="button" class="help" data-help="minD" aria-expanded="false" aria-label="最小直径の説明" data-i18n-aria-label="minD.help">?</button></span><output id="minDO"></output>
        <input type="range" id="minD" min="2" max="40" step="1" value="6">
      </div>
      <div class="row">
        <span class="lbl"><label for="maxD" data-i18n="maxD.label">最大直径</label><button type="button" class="help" data-help="maxD" aria-expanded="false" aria-label="最大直径の説明" data-i18n-aria-label="maxD.help">?</button></span><output id="maxDO"></output>
        <input type="range" id="maxD" min="10" max="150" step="1" value="60">
      </div>
      <div class="row sam-only">
        <span class="lbl"><label for="iou" data-i18n="iou.label">SAMの信頼度しきい値</label><button type="button" class="help" data-help="iou" aria-expanded="false" aria-label="SAMの信頼度しきい値の説明" data-i18n-aria-label="iou.help">?</button></span><output id="iouO"></output>
        <input type="range" id="iou" min="0.5" max="0.99" step="0.01" value="0.80">
      </div>
      <div class="row light-only">
        <span class="lbl"><label for="polar" data-i18n="polar.label">コロニーの色</label>
        <button type="button" class="help" data-help="polar" aria-expanded="false" aria-label="コロニーの色の説明" data-i18n-aria-label="polar.help">?</button></span>
        <select id="polar">
          <option value="auto" data-i18n="polar.auto">自動</option>
          <option value="bright" data-i18n="polar.bright">背景より明るい</option>
          <option value="dark" data-i18n="polar.dark">背景より暗い</option>
        </select>
      </div>
      <div class="row light-only">
        <span class="lbl"><label for="sens" data-i18n="sens.label">検出感度</label>
        <button type="button" class="help" data-help="sens" aria-expanded="false" aria-label="検出感度の説明" data-i18n-aria-label="sens.help">?</button></span><output id="sensO"></output>
        <input type="range" id="sens" min="0.5" max="2" step="0.05" value="1">
      </div>
      <div class="check">
        <input type="checkbox" id="cluster" checked>
        <span class="lbl"><label for="cluster" data-i18n="cluster.label">大きな塊は中央値の面積で割って個数に換算する</label>
        <button type="button" class="help" data-help="cluster" aria-expanded="false" aria-label="塊の換算の説明" data-i18n-aria-label="cluster.help">?</button></span>
      </div>
      <p class="note" data-i18n="note.pixels">長さの単位は、処理用に縮小した画像（長辺1024px以下）のピクセルです。</p>
    </div>

    <div class="card">
      <div class="btns">
        <button class="primary" id="run" disabled data-i18n="action.run">自動検出</button>
        <button class="secondary" id="stop" disabled data-i18n="action.stop">停止</button>
      </div>
      <div class="bar"><i id="runBar"></i></div>
      <div id="runStatus" role="status"></div>
    </div>

    <div class="card">
      <h2 data-i18n="action.save">保存</h2>
      <div class="btns">
        <button class="secondary" id="dlCsv" disabled data-i18n="action.downloadColonies">コロニー一覧 (CSV)</button>
        <button class="secondary" id="dlLog" disabled data-i18n="action.downloadRecord">実験記録 (CSV)</button>
        <button class="secondary" id="dlPng" disabled data-i18n="action.downloadImage">結果画像 (PNG)</button>
      </div>
    </div>
  </aside>
</main>

<div class="mbar" role="region" aria-label="操作バー" data-i18n-aria-label="mobile.toolbar">
  <div class="prog"><i id="mBar"></i></div>
  <div class="cnt"><span data-i18n="count.label">コロニー数</span><b id="mTotal">–</b></div>
  <button class="primary" id="mRun" disabled data-i18n="action.run">自動検出</button>
</div>

<div id="pop" role="dialog"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
